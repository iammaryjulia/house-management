<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理員登入 - 巨鴻地產</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: white;
        padding: 3rem 2rem;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .logo {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }

      .login-header h1 {
        font-size: 1.5rem;
        color: #333;
        margin-bottom: 0.5rem;
      }

      .login-header p {
        color: #999;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
      }

      .form-group input {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .login-button {
        width: 100%;
        padding: 0.8rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .error-message {
        background: #ff6b6b;
        color: white;
        padding: 1rem;
        border-radius: 4px;
        margin-bottom: 1rem;
        display: none;
      }

      .demo-info {
        background: #e7f5ff;
        border-left: 4px solid #667eea;
        padding: 1rem;
        margin-top: 2rem;
        border-radius: 4px;
        font-size: 0.9rem;
        color: #333;
      }

      .demo-info p {
        margin-bottom: 0.5rem;
      }

      .loading {
        display: none;
        text-align: center;
        color: #667eea;
        margin-top: 1rem;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 0 auto 0.5rem;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo">🏠</div>
        <h1>巨鴻地產</h1>
        <p>管理員登入</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">用戶名</label>
          <input
            type="text"
            id="username"
            placeholder="請輸入用戶名"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <input
            type="password"
            id="password"
            placeholder="請輸入密碼"
            required
          />
        </div>

        <button type="submit" class="login-button" id="loginBtn">登入</button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>登入中...</p>
        </div>
      </form>

      <div class="demo-info">
        <p><strong>演示帳號：</strong></p>
        <p>
          用戶名:
          <code
            style="
              background: #f0f0f0;
              padding: 0.2rem 0.4rem;
              border-radius: 2px;
            "
            >admin</code
          >
        </p>
        <p>
          密碼:
          <code
            style="
              background: #f0f0f0;
              padding: 0.2rem 0.4rem;
              border-radius: 2px;
            "
            >admin123</code
          >
        </p>
      </div>
    </div>

    <script>
      async function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("errorMessage");
        const loginBtn = document.getElementById("loginBtn");
        const loading = document.getElementById("loading");

        // 清空錯誤訊息
        errorDiv.style.display = "none";
        errorDiv.textContent = "";

        // 禁用按鈕
        loginBtn.disabled = true;
        loading.style.display = "block";

        try {
          const response = await fetch("/admin/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            // 登入成功，重定向到儀表板
            window.location.href = data.redirect;
          } else {
            // 顯示錯誤訊息
            errorDiv.textContent = data.error || "登入失敗";
            errorDiv.style.display = "block";
          }
        } catch (error) {
          errorDiv.textContent = "網路錯誤，請檢查連線";
          errorDiv.style.display = "block";
          console.error("Login error:", error);
        } finally {
          loginBtn.disabled = false;
          loading.style.display = "none";
        }
      }

      // 回車登入
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("password")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              document.querySelector("form").dispatchEvent(new Event("submit"));
            }
          });
      });
    </script>
  </body>
</html>
